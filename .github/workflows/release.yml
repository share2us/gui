name: release

# Build the GUI for each desktop platform with `wails build` (embeds the app
# icon, Windows manifest, and publisher metadata) and publish a GitHub Release
# with per-OS archives + a Windows installer.
#
# DELIBERATE, NOT AUTOMATIC. This used to fire on every push to main, so merging
# any change shipped a build to every installed GUI -- the in-app updater reads
# /releases/latest. Cutting a release is now an explicit action.
#
#   channel=beta   -> pre-release, --latest=false. Stable installs ask GitHub
#                     for releases/latest, so a beta is invisible to them by
#                     construction; installs that opted in (Settings -> "Get beta
#                     builds", shared with `s2u update --channel beta`) list all
#                     releases and pick the newest. This is the staging channel.
#   channel=stable -> --latest. Users get it on their next update check.
# A merge to `main` publishes a STABLE release. Safe now in a way it was not
# before: `main` is reached only through a reviewed PR from a release branch,
# after the work has been exercised on local `staging`, so a merge IS the decision
# to ship. Before, `main` doubled as the working branch.
#
# The changelog gate still applies, and reads: a stable release SAYS WHAT CHANGED.
# A merge to `main` with an empty [Unreleased] ships nothing and cuts no release
# (the author is saying this changed nothing a user sees); an explicit
# workflow_dispatch with an empty [Unreleased] still FAILS, because a person
# asked to ship and there is nothing to tell anyone.
#
# Rolling [Unreleased] under its version heading is AUTOMATIC after a stable
# release from a push (see the publish job). It used to be manual, and being
# manual is why the six releases of 2026-09-07 republished each other's notes.
#
# workflow_dispatch stays for BETA: a push carries no channel choice.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "build/**"
      - "wails.json"
      - "installer/**"
      # NOT .github/workflows/release.yml. Editing CI must not ship a release to
      # users — that path was here so workflow changes could be exercised, and
      # workflow_dispatch does that job now without touching anybody's install.
  workflow_dispatch:
    inputs:
      channel:
        description: "stable = released to all users; beta = pre-release, updater will not see it"
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.13.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - id: v
        run: echo "v=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  # Portable per-platform builds. fail-fast:false so one flaky arch (e.g. a
  # linux-arm64 runner) never blocks the rest of the release.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: win-amd64,   os: ubuntu-22.04,     platform: windows/amd64,    ext: zip }
          - { id: win-arm64,   os: ubuntu-22.04,     platform: windows/arm64,    ext: zip }
          - { id: linux-amd64, os: ubuntu-22.04,     platform: linux/amd64,      ext: tar.gz, webkit: "4.0" }
          - { id: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64,      ext: tar.gz, webkit: "4.1", tags: webkit2_41 }
          - { id: darwin,      os: macos-latest,     platform: darwin/universal, ext: zip, app: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.25", check-latest: true }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Linux WebView deps
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev "libwebkit2gtk-${{ matrix.webkit }}-dev" libayatana-appindicator3-dev
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: wails build
        run: |
          set -euo pipefail
          TAGS="${{ matrix.tags }}"
          "$(go env GOPATH)/bin/wails" build -platform "${{ matrix.platform }}" -s -skipbindings \
            ${TAGS:+-tags "$TAGS"} \
            -ldflags "-X main.buildVersion=${{ needs.version.outputs.v }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          p="${{ matrix.platform }}"; os="${p%/*}"; arch="${p#*/}"
          if command -v sha256sum >/dev/null; then SHA="sha256sum"; else SHA="shasum -a 256"; fi
          if [ "${{ matrix.app }}" = "true" ]; then
            name="share2us-gui_darwin_universal.zip"
            ( cd build/bin && zip -q -r -X "$GITHUB_WORKSPACE/dist/$name" share2us-gui.app )
          elif [ "$os" = windows ]; then
            name="share2us-gui_${os}_${arch}.zip"
            ( cd build/bin && zip -q -X "$GITHUB_WORKSPACE/dist/$name" share2us-gui.exe )
          else
            name="share2us-gui_${os}_${arch}.tar.gz"
            tar -C build/bin -czf "dist/$name" share2us-gui
          fi
          ( cd dist && cksum "$name" > "$name.crc32" && $SHA "$name" | awk '{print $1}' > "$name.sha256" )
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.id }}
          path: dist/*

  # Double-click Windows installer (Inno Setup): GUI (wails-built, with icon) +
  # the latest s2u CLI, so setup can install GUI, CLI, or both.
  installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.25", check-latest: true }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Prepare signing certificate
        shell: pwsh
        run: |
          # Signs the DIRECT-DOWNLOAD artifacts only: share2us-gui.exe, the s2u CLI
          # and (later) Setup.exe. It does NOT sign the MSIX, and must not: the MSIX
          # Publisher is the Partner Center identity (CN=<GUID>), the Store re-signs
          # it with its own trusted certificate on ingestion, and it is uploaded
          # UNSIGNED. Nothing in this step may touch the MSIX or its manifest.
          #
          # Prefer a STABLE certificate from secrets. A per-run
          # New-SelfSignedCertificate gives every release a different, unrelated
          # keypair, so an installed client has no way to tell that an update was
          # signed by the same publisher as the build it is running — which is why
          # the updater could never verify anything (see internal/update).
          # With a stable key the thumbprint is baked into the binary and the
          # updater refuses a release signed by anything else.
          #
          # Falls back to the old per-run cert when the secret is absent, so a fork
          # or a repo without the secret still produces working (just unpinned)
          # builds rather than failing.
          $pfxB64 = "${{ secrets.SIGN_PFX_B64 }}"
          if ($pfxB64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'share2us-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxB64))
            $pw = ConvertTo-SecureString "${{ secrets.SIGN_PFX_PASSWORD }}" -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfxPath -Force
            "SIGN_PINNED=$($cert.Thumbprint)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
            Write-Host "signing with the stable certificate (thumbprint pinned into the build)"
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=Share2.us, O=Share2.us" `
              -CertStoreLocation Cert:\CurrentUser\My `
              -KeyUsage DigitalSignature -HashAlgorithm SHA256 `
              -TextExtension @("2.5.29.19={text}") `
              -NotAfter (Get-Date).AddYears(5)
            Write-Host "::warning::SIGN_PFX_B64 is not set - falling back to a per-run self-signed cert. Updates from this build cannot be publisher-verified."
          }
          "SIGN_THUMB=$($cert.Thumbprint)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: wails build + fetch CLI
        shell: bash
        run: |
          set -euo pipefail
          wails="$(go env GOPATH)/bin/wails"
          # 1) Normal build -> the direct-download binary for Setup.exe. Keeps the
          #    in-app updater (self-updates from GitHub Releases).
          # expectedSignerThumbprint pins the publisher: this binary will refuse an
          # update signed by any other certificate. Empty when SIGN_PFX_B64 is not
          # configured, which leaves the old unpinned behaviour.
          "$wails" build -platform windows/amd64 -s -skipbindings \
            -ldflags "-X main.buildVersion=${{ needs.version.outputs.v }} -X main.expectedSignerThumbprint=${SIGN_PINNED:-}"
          mkdir -p dist
          cp build/bin/share2us-gui.exe dist/
          # 2) Store build (-tags store) -> the binary that goes INTO the MSIX. The
          #    updater is compiled out (Store policy 10.2.5: the Store owns updates).
          #    Stash it before the normal exe location is reused.
          "$wails" build -platform windows/amd64 -s -skipbindings -tags store \
            -ldflags "-X main.buildVersion=${{ needs.version.outputs.v }}"
          mkdir -p store-bin
          cp build/bin/share2us-gui.exe store-bin/share2us-gui.exe
          if curl -fsSL -o cli.zip https://github.com/share2us/cli/releases/latest/download/share2us_windows_amd64.zip; then
            unzip -o cli.zip -d dist && mv -f dist/share2us.exe dist/s2u.exe
          else
            echo "CLI release unavailable; installer will ship GUI-only"
          fi
          ls -la dist store-bin
      - name: Sign binaries + build MSIX (Store-ready, unsigned)
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" |
            Sort-Object FullName | Select-Object -Last 1).FullName
          $signtool = Join-Path $sdk 'signtool.exe'
          "SIGNTOOL=$signtool" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

          # 1) Sign the app + CLI binaries in dist\.
          #
          # $env:SIGN_THUMB, not $cert.Thumbprint. $cert is created in the
          # "Prepare signing certificate" step, and PowerShell variables do NOT
          # survive across GitHub Actions steps — each run: block is a fresh
          # shell. So $cert was empty here, /sha1 swallowed the next argument,
          # and every release since the first logged:
          #
          #   SignTool Error: Invalid SHA1 hash format: /fd
          #
          # once per binary, while the step stayed green because a mid-script
          # native failure does not fail a pwsh step. share2us-gui.exe and
          # s2u.exe have therefore NEVER been signed; only Setup.exe was, because
          # that step already reads $env:SIGN_THUMB. Fixed 2026-09-08.
          if (-not $env:SIGN_THUMB) {
            throw "SIGN_THUMB is not set - the signing step ran before the certificate step, or that step failed."
          }
          foreach ($f in @('dist\share2us-gui.exe','dist\s2u.exe')) {
            if (Test-Path $f) {
              & $signtool sign /sha1 $env:SIGN_THUMB /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
              # Fail loudly. Silence is what let this run broken for months.
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $f (exit $LASTEXITCODE)" }
              # Presence, NOT chain validity. `signtool verify /pa` applies the
              # Authenticode policy, which requires a chain to a trusted root —
              # something a self-signed certificate can never satisfy, so that
              # check failed the first run after this fix even though the binary
              # HAD just been signed ("terminated in a root"). The app's own
              # verifier learned this already: see internal/update/verify_windows.go,
              # which deliberately does not require Status == Valid because
              # nothing imports our cert into a trust store (and importing one is
              # what got the installer flagged as malware in c1f82ae).
              # NotSigned is the failure worth catching here.
              $sig = Get-AuthenticodeSignature $f
              if ($sig.Status -eq 'NotSigned') { throw "no signature landed on $f" }
              Write-Host "signed $f (status $($sig.Status), signer $($sig.SignerCertificate.Subject))"
            }
          }

          # 2) Build the MSIX (unsigned) from the (already-built) app + assets.
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force -Path "$stage\Assets" | Out-Null
          # Use the STORE-tagged binary (updater compiled out), not the direct-
          # download build, so the packaged app never self-updates (policy 10.2.5).
          Copy-Item store-bin\share2us-gui.exe $stage\
          # The CLI ships in the package too, so Store users get a SIGNED s2u
          # (todo §RR: Smart App Control refuses the unsigned one outright, and
          # the Store's own certificate is the answer that costs nothing). The
          # binary is already here — the "wails build + fetch CLI" step above
          # downloaded it into dist\ and it is what the installer bundles.
          if (Test-Path 'dist\s2u.exe') {
            Copy-Item dist\s2u.exe $stage\
          } else {
            # The manifest declares an Application for it, so a package without
            # the binary would fail Store ingestion in a confusing way. Better to
            # stop here and say why.
            throw "dist\s2u.exe is missing - the MSIX manifest declares the CLI, so the package would be invalid. Did the CLI download step fail?"
          }
          Copy-Item installer\msix\Assets\* $stage\Assets\
          # MSIX Version must be 4-part numeric with the 4th (revision) = 0 for the
          # Store; use the CI run number for the build part.
          $ver = "1.0.${{ github.run_number }}.0"
          (Get-Content installer\msix\AppxManifest.xml) -replace 'Version="1.0.0.0"', "Version=`"$ver`"" | Set-Content "$stage\AppxManifest.xml"
          $msix = "dist\Share2Us-${{ needs.version.outputs.v }}.msix"
          & "$sdk\makeappx.exe" pack /d $stage /p $msix /o
          # NOTE: no signtool on the MSIX (Store signs it; Publisher = CN=<GUID>).
          Get-ChildItem dist
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $dist = Join-Path (Get-Location) 'dist'
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DDistDir=$dist" "/DAppVersion=${{ needs.version.outputs.v }}" `
            installer\windows\share2us.iss
      - name: Sign installer (same self-signed cert)
        shell: pwsh
        run: |
          Get-ChildItem installer\windows\Output\*.exe | ForEach-Object {
            & $env:SIGNTOOL sign /sha1 $env:SIGN_THUMB /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          # Publish a SHA-256 next to Setup.exe. The in-app updater downloads THIS
          # asset, and until now it was the only published artifact with no hash,
          # so the updater had nothing to verify against. Authenticode cannot serve
          # that purpose here: the signing cert is generated fresh by
          # New-SelfSignedCertificate on every run, so it chains to nothing and its
          # thumbprint changes each release.
          Get-ChildItem installer\windows\Output\*.exe | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() |
              Set-Content -Encoding ascii ($_.FullName + '.sha256')
          }
          # Stage the standalone (unsigned) MSIX next to Setup.exe so the artifact
          # is a single flat folder (one common root -> upload/download stays flat,
          # and the publish glob only ever sees files, never subdirectories).
          Copy-Item dist\*.msix installer\windows\Output\
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-installer
          # Setup.exe = app + CLI only. The standalone unsigned .msix is published
          # for Microsoft Store submission (the Store re-signs it).
          path: installer/windows/Output/*

  # Publish only what fully built.
  #
  # This used to read `always() && needs.version.result == 'success'`, described
  # as "tolerant of a failed matrix leg". The tolerance was the problem: on
  # 2026-09-08 the installer job failed partway, and publish ran anyway and
  # created a release carrying the portable zips but NO Share2Us-Setup.exe and no
  # MSIX — then marked it Latest, which is precisely where the download page and
  # the in-app updater look for the installer. A broken build became the release
  # every Windows user resolves to.
  #
  # A partial release is worse than no release: no release is visible and gets
  # fixed, while a partial one looks finished and quietly breaks installs. If a
  # leg fails, fix it and re-run; nothing ships in the meantime.
  publish:
    needs: [version, build, installer]
    if: >-
      ${{ needs.version.result == 'success'
          && needs.build.result == 'success'
          && needs.installer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The release notes come from CHANGELOG.md, so this job needs the repo, not
      # just the build artifacts. Without it the file is simply absent, which the
      # notes step used to report as "[Unreleased] is empty" — the right refusal
      # for the wrong reason, and a confusing one to debug.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: staging, pattern: "pkg-*", merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.v }}
        run: |
          set -euo pipefail
          ls -laR staging
          # Pass files only (never a directory) so nested artifact layouts can't
          # break the release upload.
          mapfile -t assets < <(find staging -type f | sort)
          # Notes come from CHANGELOG.md's [Unreleased] section; a stable
          # release FAILS when it is empty, so a build cannot reach users
          # without saying what changed.
          NOTES_FILE=notes.md
          # Distinguish "no CHANGELOG.md at all" from "the section is empty": they
          # need different fixes, and conflating them sent me looking at the wrong
          # one.
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing from the checkout - the publish job cannot read release notes."
            exit 1
          fi
          unreleased() { awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/<!--/,/-->/d'; }
          if unreleased | grep -q '[^[:space:]]'; then
            unreleased > "$NOTES_FILE"
          elif [ "${{ inputs.channel || 'stable' }}" != stable ]; then
            echo "Beta build from ${GITHUB_SHA}. Not served to stable users." > "$NOTES_FILE"
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            # A person asked for this release by hand. Refusing loudly is right:
            # they meant to ship something and there is nothing to say about it.
            echo "::error::CHANGELOG.md [Unreleased] is empty - a stable release needs release notes."
            exit 1
          else
            # Reached by a merge to main. An empty [Unreleased] is the author
            # saying this changed nothing a user sees - a refactor, a test, a CI
            # tweak - so there is nothing to ship and no release is cut.
            #
            # This used to fail the run. Merges that change nothing user-facing
            # are ordinary and frequent, so that painted the build red for doing
            # the right thing, and a red build nobody can act on is a red build
            # everybody learns to ignore. The contract is now: write notes and it
            # ships, write none and it does not.
            echo "::notice::[Unreleased] is empty - nothing user-facing to ship, so no release was cut for ${GITHUB_SHA}."
            exit 0
          fi
          {
            echo ""
            echo "Windows: the **Share2Us-Setup** installer, or \`irm https://raw.githubusercontent.com/share2us/gui/main/scripts/install.ps1 | iex\`"
            echo "Linux: \`curl -fsSL https://raw.githubusercontent.com/share2us/gui/main/scripts/install.sh | sh\`"
            echo "macOS: unzip the .app (unsigned — right-click → Open the first time)."
          } >> "$NOTES_FILE"

          if [ "${{ inputs.channel || 'stable' }}" = stable ]; then
            LATEST_FLAGS="--latest"
          else
            LATEST_FLAGS="--prerelease --latest=false"
          fi
          # shellcheck disable=SC2086
          gh release create "v${VERSION}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Share2Us GUI ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            $LATEST_FLAGS

          # Roll [Unreleased] under the version that just shipped.
          #
          # This was a manual step, and it failed exactly when it mattered: the
          # six releases of 2026-09-07 republished each other's notes, and so did
          # two more the next day — someone reading them is told about fixes they
          # already have. A step that must be remembered after every release, in
          # the middle of shipping, is a step that will be skipped.
          #
          # Only for a stable release from a push: a beta's notes are generated,
          # and a hand-run release should not rewrite the file under the operator.
          # CHANGELOG.md is not a release trigger path, so this commit cannot
          # start another run.
          if [ "${{ inputs.channel || 'stable' }}" = stable ] && [ "${{ github.event_name }}" = push ]; then
            python3 - "$VERSION" <<'ROLL'
          import datetime, re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          marker = '## [Unreleased]'
          start = text.index(marker) + len(marker)
          nxt = text.find('\n## [', start)
          body = text[start:nxt if nxt != -1 else len(text)]
          # Comments are guidance, not release notes.
          content = re.sub(r'<!--.*?-->', '', body, flags=re.S).strip()
          if content:
              today = datetime.date.today().isoformat()
              kept = re.findall(r'<!--.*?-->', body, flags=re.S)
              header = marker + '\n\n' + ('\n'.join(kept) + '\n\n' if kept else '')
              rolled = f'## [{version}] - {today}\n\n{content}\n'
              text = text[:text.index(marker)] + header + rolled + text[nxt if nxt != -1 else len(text):]
              open('CHANGELOG.md', 'w').write(text)
              print(f'rolled [Unreleased] under {version}')
          else:
              print('[Unreleased] was empty; nothing to roll')
          ROLL
            if ! git diff --quiet CHANGELOG.md; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add CHANGELOG.md
              git commit -m "docs(changelog): roll [Unreleased] under ${VERSION}"
              # Never clobber a merge that landed while this ran.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the changelog roll; do it by hand"
            fi
          fi
